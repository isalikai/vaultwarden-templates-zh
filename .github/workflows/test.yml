name: Tests

on:
  push:
    paths: ["scripts/**", "tests/**", "glossary.json"]
  pull_request:
    paths: ["scripts/**", "tests/**", "glossary.json"]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
